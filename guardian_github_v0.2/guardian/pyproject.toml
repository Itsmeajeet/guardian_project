[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-security"
version = "0.2.0"
description = "A small, readable, cross-platform security scanner for learning"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Education",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools]
packages = ["guardian"]

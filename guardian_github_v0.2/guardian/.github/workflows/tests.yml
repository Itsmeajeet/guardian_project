name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Guardian is cross-platform, so prove it on all three operating systems.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover tests -v
      - name: Smoke test the command line
        run: python -m guardian --version
